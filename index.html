<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>元素カードゲーム</title>
<style>
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent} /* ダブルタップでの拡大を防ぐ */
body{margin:0;background:#050914;color:#e8ecf4;font-family:"Hiragino Sans","Yu Gothic",sans-serif;font-size:14px}
#app{max-width:1100px;margin:0 auto;padding:8px}
.top{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pl{border:2px solid #223052;border-radius:8px;padding:6px;min-height:92px}
.pl.on{border-color:#00E5FF;box-shadow:0 0 8px #00E5FF55}
.pl h3{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between}
.row{margin:2px 0;font-size:12px;line-height:1.7}
.ch{display:inline-block;border:1px solid var(--c,#667);color:var(--c,#ccd);border-radius:4px;padding:0 4px;margin:1px;font-weight:700}
.cp{background:#16254a;border-radius:4px;padding:0 4px;margin:1px;display:inline-block}
.msg{min-height:22px;margin:6px 2px;color:#FFEB3B}
.board{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:4px}
.slot{aspect-ratio:3/4}
.card{width:100%;aspect-ratio:3/4;border-radius:6px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.back{background:#14213d;border:2px solid #2a3c6b;cursor:pointer}
.face{background:#0c1426;border:2px solid var(--c);color:var(--c);gap:1px}
.face b{font-size:calc(var(--cw)*.42);line-height:1}
.face i{font-style:normal;font-size:calc(var(--cw)*.17);color:#e8ecf4}
.face small{font-size:max(6px,calc(var(--cw)*.12))}
.act{margin:10px 0;padding:8px;border-top:1px solid #223052;text-align:center}
button.b{background:#00E5FF;color:#050914;border:0;border-radius:6px;padding:10px 16px;margin:4px;font-size:15px;font-weight:700}
button.b.g{background:#2a3c6b;color:#e8ecf4}
button.b:disabled{opacity:.35}
.ov{z-index:20;position:fixed;inset:0;background:#050914cc;display:flex;align-items:center;justify-content:center;padding:12px}
.md{background:#0c1426;border:2px solid #2a3c6b;border-radius:10px;padding:14px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
.md button.ch{background:none;font-size:16px;padding:6px 10px;margin:4px}
.md button.ch.sel{background:var(--c);color:#050914}
table{width:100%;border-collapse:collapse;text-align:center}
td,th{border-bottom:1px solid #223052;padding:4px}
.ms{margin-right:auto;font-size:13px;color:#FFEB3B}
.nav{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}
button.b.sm{padding:6px 12px;font-size:13px;margin:0}
.zk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.zc{border:1px solid #2a3c6b;border-radius:8px;padding:6px}.zc.on{border-color:#76FF03}.zc.off{opacity:.45}
.md h3{margin:12px 0 4px}
.bw{position:relative}
.float{position:absolute;left:0;right:0;top:6px;display:flex;justify-content:center;z-index:5;pointer-events:none}
.box{pointer-events:auto;background:#050914f2;border:2px solid #00E5FF;border-radius:10px;padding:8px 12px;text-align:center;box-shadow:0 0 18px #00E5FF88;max-width:96%}
.ht{font-size:13px;margin:3px 0}.ht b{color:#FFEB3B}
.banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:clamp(30px,9vw,60px);font-weight:900;color:#FFEB3B;text-shadow:0 0 14px #FF007F,0 0 4px #000;pointer-events:none;z-index:9;animation:pop 2s forwards}
.banner small{display:block;font-size:.38em;color:#fff}
@keyframes pop{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0}}
.rc{margin:6px 2px;color:#b8c4dc}.rc summary{cursor:pointer}
</style></head><body><div id="app"></div>
<script>
// ===== 設定データ(ノーマル)※難易度を増やすときはこのCONFIGを差し替える =====
const CONFIG={
  name:'ノーマル',
  copies:4,          // 各元素の枚数
  firstBonus:1,      // 先攻の補正点
  leftoverIsJunk:true, // 【仮】あがり時、融合後に残った元素カードをカス扱いにする(1枚=カス1枚)
  elements:[ // 記号, 名前, 属性タグ, 色
    ['H','水素','LIFE/LIGHT','#00E5FF'],['O','酸素','LIFE/WIND','#4DA3FF'],['N','窒素','LIFE/WISDOM','#1DE9B6'], // 【仮】LIFE系は同じシアンだと区別しにくいため、少しずつ色を変更
   
    ['C','炭素','EARTH/BASE','#9D4EDD'],['Fe','鉄','METAL/POWER','#FFB300'],['Si','ケイ素','CRYSTAL/TECH','#7B7BFF'],
    ['Cu','銅','METAL/TECH','#E07A3F'],['Zn','亜鉛','GUARD/TECH','#FF007F'],['Na','ナトリウム','ALKALI/SALT','#FF8A65'],
    ['Cl','塩素','HALOGEN/AIR','#76FF03'],['Ca','カルシウム','BONE/BASE','#ECEFF1'],['S','硫黄','MINERAL/POWER','#FFEB3B'],
    ['Al','アルミニウム','METAL/LIGHT','#B0BEC5']],
  compounds:{ // r=必要な元素カードの枚数, p=基本点 【仮】化学式をもとにした枚数(石灰石・硫酸・鋼鉄・真鍮・ジュラルミンの枚数も仮)
    '水':{r:{H:2,O:1},p:3},'二酸化炭素':{r:{C:1,O:2},p:4},'アンモニア':{r:{N:1,H:3},p:4},
    '鋼鉄':{r:{Fe:1,C:1},p:6},'ガラス':{r:{Si:1,O:2},p:5},'真鍮':{r:{Cu:1,Zn:1},p:6},
    '食塩':{r:{Na:1,Cl:1},p:4},'石灰石':{r:{Ca:1,C:1,O:3},p:4},'硫酸':{r:{H:2,S:1,O:4},p:5},
    'ジュラルミン':{r:{Al:1,Cu:1},p:6}},
  yaku:[ // need=必要な化合物, distinct=異なる化合物の種類数, b=役ボーナス
    {n:'生命の水',need:{'水':2},b:5},{n:'空気の循環',need:{'水':1,'二酸化炭素':1},b:6},
    {n:'海の恵み',need:{'水':1,'食塩':1},b:6},{n:'工業の第一歩',need:{'鋼鉄':1,'ガラス':1},b:7},
    {n:'合金職人',need:{'鋼鉄':1,'真鍮':1},b:8},{n:'空飛ぶ金属',need:{'ジュラルミン':1,'鋼鉄':1},b:8},
    {n:'工業革命',need:{'鋼鉄':1,'ガラス':1,'真鍮':1},b:10},{n:'完全錬成',distinct:5,b:12}],
  junk:[[36,3],[24,2],[12,1]] // [カス枚数以上, 点]
};
// ===== ゲーム本体 =====
const C=CONFIG,E={};C.elements.forEach(([s,n,t,c])=>E[s]={s,n,t,c});
const $=id=>document.getElementById(id);
let G=null,M=null,V=null; // G=1ゲームの状態, M=マッチ(複数ゲーム)の状態, V=ルール/図鑑の表示
// 図鑑:作った化合物の回数をこの端末のブラウザに保存する(保存できない環境では、遊んでいる間だけ記録)
let Z={};try{Z=JSON.parse(localStorage.getItem('elemZukan')||'{}')}catch(e){}
const saveZ=()=>{try{localStorage.setItem('elemZukan',JSON.stringify(Z))}catch(e){}};
const view=v=>{V=v;render()};
function menu(){M=null;G=null;render()}
function start(n){M={n,g:0,wins:[0,0],pts:[0,0],hist:[],first:Math.random()<.5?0:1};newGame()} // 先攻は最初だけランダム、以降は交代(仮)
function nextGame(){M.first=1-M.first;newGame()}
function endGame(){G.over=true;const w=G.winner;M.g++;
  if(w!=null){M.wins[w]++;M.pts[w]+=G.p[w].res.total} // ゲームに勝つのは、あがって得点した人
  M.hist.push(w);render()}
function nav(){
  const m=M&&G?`<span class=ms>第${G.over?M.g:M.g+1}/${M.n}ゲーム ${M.wins[0]}勝-${M.wins[1]}勝</span>`:'';
  return`<div class=nav>${m}<button class="b g sm" onclick="view('rules')">ルール・リスト</button><button class="b g sm" onclick="view('zukan')">図鑑 ${Object.keys(Z).length}/${Object.keys(C.compounds).length}</button></div>`}
function resetZ(){if(confirm('図鑑の記録を消しますか?')){Z={};saveZ();render()}}
function newGame(){
  const d=[];C.elements.forEach(e=>{for(let k=0;k<C.copies;k++)d.push(e[0])});
  for(let i=d.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
  const mk=n=>({n,cards:{},comps:{},used:{},yakus:[],pend:null,cand:null,junk:0,cp:0,yp:0,jp:0});
  const f=M.first;
  G={b:d.map(e=>({e,s:'down'})),p:[mk('プレイヤー1'),mk('プレイヤー2')],cur:f,first:f,ph:'pick',sel:[],lock:false,msg:'',fz:null,over:false};
  render();
}
function flip(i){
  if(G.lock||G.ph!=='pick'||G.b[i].s!=='down')return;
  G.b[i].s='up';G.sel.push(i);
  if(G.sel.length<2){render();return}
  G.lock=true;render(); // 2枚めくったら、表示が終わるまで他のカードは触れない
  const[a,b]=G.sel,p=G.p[G.cur];
  if(G.b[a].e===G.b[b].e){
    setTimeout(()=>{const e=G.b[a].e;G.b[a].s=G.b[b].s='taken';
      p.cards[e]=(p.cards[e]||0)+2; // ペア=同じ元素2枚を獲得
      G.sel=[];G.lock=false;G.msg=nm(e)+'のペア成立!';afterPair(p)},800);
  }else{
    setTimeout(()=>{G.b[a].s=G.b[b].s='down';G.sel=[];G.lock=false;
      G.msg='ペアではありません。';turnEnd()},1300);
  }
}
function turnEnd(){
  if(!G.b.some(c=>c.s==='down')){finish();return}
  G.cur=1-G.cur;G.ph='pick';render();
}
const nm=s=>E[s].n+'('+s+')';
const rt=r=>Object.entries(r).map(([s,n])=>`${E[s].n}(${s}×${n})`).join(' + ');
function recipes(){return`<details class=rc ${G.ro?'open':''} ontoggle="G.ro=this.open"><summary>レシピ一覧</summary>${Object.keys(C.compounds).map(k=>`<div class=ht>${rt(C.compounds[k].r)} = <b>${k}</b>(+${C.compounds[k].p}点)</div>`).join('')}</details>`}
// 【仮】ペアを取るたびに、高得点になる組み合わせで自動融合する(化合物の基本点+役ボーナスが最大)
function yakuTotal(p,list){const q={comps:{...p.comps},used:{...p.used}};list.forEach(k=>q.comps[k]=(q.comps[k]||0)+1);
  let t=0,y;while(y=findYaku(q)){for(const c in y.use)q.used[c]=(q.used[c]||0)+y.use[c];t+=y.y.b}return t}
function bestFuse(p){
  const ns=Object.keys(C.compounds);let best={sc:0,list:[]};
  (function dfs(i,inv,list,base){
    if(i===ns.length){const sc=base+(list.length?yakuTotal(p,list):0);if(sc>best.sc)best={sc,list:list.slice()};return}
    const k=ns[i],r=C.compounds[k].r,v={...inv};let n=0;
    for(;;){dfs(i+1,{...v},list.concat(Array(n).fill(k)),base+n*C.compounds[k].p);
      if(!Object.entries(r).every(([x,q])=>(v[x]||0)>=q))break;
      for(const x in r)v[x]-=r[x];n++}
  })(0,{...p.cards},[],0);
  return best.list;
}
// 【仮】融合はあがるときに最終的に行う。途中は「いま融合したらどうなるか」を計算するだけ
function calc(p,i){
  const list=bestFuse(p),inv={...p.cards},comps={};let cp=0;
  list.forEach(k=>{const r=C.compounds[k].r;for(const x in r)inv[x]-=r[x];comps[k]=(comps[k]||0)+1;cp+=C.compounds[k].p});
  const q={comps:{...comps},used:{}},ys=[];let y;
  while(y=findYaku(q)){for(const c in y.use)q.used[c]=(q.used[c]||0)+y.use[c];ys.push(y.y)}
  const yp=ys.reduce((a,v)=>a+v.b,0),junk=C.leftoverIsJunk?Object.values(inv).reduce((a,n)=>a+n,0):0;
  const jp=(C.junk.find(([n])=>junk>=n)||[0,0])[1],fb=i===G.first?C.firstBonus:0; // 【仮】先攻補正点はあがった人が先攻のときだけ
  const left=Object.entries(inv).filter(([,n])=>n>0).map(([s,n])=>`${E[s].n}(${s}×${n})`).join('、');
  const lines=list.map(k=>`${rt(C.compounds[k].r)} = <b>${k}</b>(+${C.compounds[k].p}点)`)
    .concat(ys.map(v=>`役「${v.n}」(+${v.b}点)`),left?['余り:'+left]:[]);
  return{list,inv,comps,cp,ys,yp,junk,jp,fb,lines,total:cp+yp+jp+fb};
}
function afterPair(p){
  const c=calc(p,G.cur);
  if(!c.list.length){ // 融合できるカードがないときは、あがり/こいこいを出さずにそのまま続ける
    if(!G.b.some(x=>x.s==='down')){finish();return}
    G.ph='pick';render();return}
  G.pre=c;G.msg='融合できるカードがそろいました';G.ph='yaku';render();
}
function findYaku(p){
  const av=k=>(p.comps[k]||0)-(p.used[k]||0);
  for(const y of [...C.yaku].sort((x,z)=>z.b-x.b)){
    if(y.distinct){const ks=Object.keys(C.compounds).filter(k=>av(k)>0);
      if(ks.length>=y.distinct)return{y,use:ks.slice(0,y.distinct).reduce((o,k)=>(o[k]=1,o),{})}}
    else if(Object.keys(y.need).every(k=>av(k)>=y.need[k]))return{y,use:y.need};
  }
  return null;
}
function agari(){ // あがり=ここで融合を確定して点数計算(得点できるのはあがった人だけ・ゲーム終了)
  const p=G.p[G.cur],c=calc(p,G.cur);
  const nw=[...new Set(c.list)].filter(k=>!Z[k]);c.list.forEach(k=>Z[k]=(Z[k]||0)+1);saveZ();G.newK=nw; // 図鑑に登録
  Object.assign(p,{res:c,cards:c.inv,comps:c.comps,yakus:c.ys.map(v=>v.n)});
  G.winner=G.cur;G.msg=p.n+'があがり!';endGame()}
function koikoi(){ // こいこい=ゲーム再開(同じ人が続けてめくる)
  G.banner='こいこい!';G.msg='こいこい!ゲーム再開';
  if(!G.b.some(c=>c.s==='down')){finish();return}
  G.ph='pick';render()}
function finish(){ // 【仮】だれもあがらずに札がなくなったら引き分け(得点なし)
  G.winner=null;endGame()}
// ===== 表示 =====
function panel(p,i){
  const c=G.over?(G.winner===i?p.res:null):calc(p,i),pre=G.over?'':'(あがり時)';
  const pr=Object.entries(p.cards).filter(([,n])=>n>0).map(([s,n])=>`<span class=ch style="--c:${E[s].c}">${s}×${n}</span>`).join('')||'なし';
  const cm=c?Object.entries(c.comps).map(([k,n])=>`<span class=cp>${k}×${n}</span>`).join('')||'なし':'—';
  const yk=c?c.ys.map(v=>v.n).join('、')||'なし':'—';
  const t=c?pre+c.total+'点':(G.over?'0点':'');
  return `<div class="pl ${i===G.cur&&!G.over?'on':''}"><h3><span>${p.n}${i===G.first?'(先攻)':''}</span><span>${t}</span></h3>
  <div class=row>元素:${pr}</div><div class=row>化合物${pre}:${cm}</div><div class=row>役${pre}:${yk}</div><div class=row>カス${pre}:${c?c.junk+'枚':'—'}</div></div>`;
}
function card(c,i){
  if(c.s==='taken')return'<div class=slot></div>';
  if(c.s==='down')return`<button class="card back" onclick="flip(${i})" aria-label="裏向きのカード"></button>`;
  const e=E[c.e];return`<div class="card face" style="--c:${e.c}"><b>${e.s}</b><i>${e.n}</i><small>${e.t}</small></div>`;
}
function act(){
  const p=G.p[G.cur];if(G.over)return'';
  if(G.ph==='pick')return`${p.n}の手番:裏向きのカードを2枚めくってください`;
  return'';
}
// あがり/こいこいは、融合したときだけカードの上に表示する
function float(){
  if(G.over||G.ph!=='yaku')return'';
  const c=G.pre;
  return`<div class=float><div class=box><div class=ht style="font-size:15px">いまあがると、次のように融合します</div>${c.lines.map(l=>`<div class=ht>${l}</div>`).join('')}<div class=ht style="font-size:16px">あがり時の点数:<b>${c.total}点</b></div><button class=b onclick=agari()>あがり(ゲーム終了)</button><button class="b g" onclick=koikoi()>こいこい(続ける)</button></div></div>`;
}
function rulesHTML(){
  const jk=[...C.junk].sort((a,b)=>a[0]-b[0]);
  const jt=jk.map(([n,p],i)=>`${n}${jk[i+1]?'〜'+(jk[i+1][0]-1)+'枚':'枚以上'}:${p}点`).join('、')+`(${jk[0][0]-1}枚以下:0点)`;
  const L=['2人で交代します。裏向きのカードを2枚めくり、同じ元素ならペア成立。2枚を獲得して、続けてめくれます。','違う元素なら、裏に戻して相手の番になります。','化合物は、獲得した元素カードの枚数で決まります(下の融合リスト)。使わなかったカードは持ち越せます。','融合できるカードがそろうと、「あがり」か「こいこい」を選べます。','あがり:その場で融合して点数を計算し、ゲーム終了。得点できるのはあがった人だけです。','こいこい:ゲーム再開。同じ人が続けてめくります。','融合は、手持ちのカードで一番高得点になる組み合わせを自動で選びます。','融合に使わず残ったカードは、カス(1枚=1枚)になります。','先攻はあがったときに+'+C.firstBonus+'点。だれもあがらずに札がなくなったら引き分けです。','ゲーム数は最初に1・3・5から選びます。ゲームに勝つのは得点が多い方(あがった人)で、勝ったゲームが多い方がマッチの勝者です(同数なら累計点)。先攻はゲームごとに交代します。'];
  return`<h3 style="margin-top:0">遊び方</h3>${L.map((t,i)=>`<div class=ht>${i+1}. ${t}</div>`).join('')}
  <h3>融合リスト</h3>${Object.keys(C.compounds).map(k=>`<div class=ht>${rt(C.compounds[k].r)} = <b>${k}</b>(+${C.compounds[k].p}点)</div>`).join('')}
  <h3>役リスト(化合物の組み合わせ)</h3>${C.yaku.map(y=>`<div class=ht><b>${y.n}</b>:${y.distinct?'異なる化合物'+y.distinct+'種類':Object.entries(y.need).map(([k,n])=>n>1?k+'×'+n:k).join(' + ')}(+${y.b}点)</div>`).join('')}
  <h3>カス点</h3><div class=ht>${jt}</div>`;
}
function zukanHTML(){
  const ks=Object.keys(C.compounds);
  return`<h3 style="margin-top:0">化合物図鑑 ${ks.filter(k=>Z[k]).length}/${ks.length}</h3><div class=zk>${ks.map(k=>{const n=Z[k],e=C.compounds[k];
    return n?`<div class="zc on"><b style="font-size:15px">${k}</b><div class=ht>${rt(e.r)}</div><div class=ht>+${e.p}点 / 作った回数 ${n}回</div></div>`
    :`<div class="zc off"><b style="font-size:15px">？？？</b><div class=ht>まだ作っていません</div></div>`}).join('')}</div>
  <div style="margin-top:8px"><button class="b g sm" onclick=resetZ()>記録を消す</button></div>`;
}
function matchHTML(){
  const [a,b]=G.p,h=M.hist.map((w,i)=>`${i+1}ゲーム目:${w==null?'引き分け':G.p[w].n}`).join(' / ');
  const sm=`<div class=ht>勝ち数 ${a.n} ${M.wins[0]} - ${M.wins[1]} ${b.n}(累計点 ${M.pts[0]} - ${M.pts[1]})</div><div class=ht>${h}</div>`;
  if(M.g<M.n)return sm+`<div style="text-align:center"><button class=b onclick=nextGame()>次のゲームへ(${M.g+1}/${M.n})</button></div>`;
  const d=M.wins[0]-M.wins[1]||M.pts[0]-M.pts[1]; // 勝ったゲーム数→同数なら累計点で決める(仮)
  const r=d>0?a.n+'の勝ち!':d<0?b.n+'の勝ち!':'引き分け';
  return sm+(M.n>1?`<h2>マッチ結果:${r}</h2>`:'')+`<div style="text-align:center"><button class=b onclick=menu()>ゲーム数を選び直す</button></div>`;
}
function modal(){
  if(V)return`<div class=ov><div class=md>${V==='rules'?rulesHTML():zukanHTML()}<div style="text-align:center;margin-top:8px"><button class=b onclick="view(null)">閉じる</button></div></div></div>`;
  if(!G.over)return'';
  const w=G.winner,[a,b]=G.p,c=w==null?null:G.p[w].res;
  const row=(l,f)=>`<tr><td>${l}</td>${[0,1].map(i=>`<td>${w===i?f(G.p[i].res):'—'}</td>`).join('')}</tr>`;
  return`<div class=ov><div class=md><h2 style="margin-top:0">${c?G.p[w].n+'の勝ち!(あがり)':'引き分け(だれもあがれませんでした)'}</h2>
  ${c?c.lines.map(l=>`<div class=ht>${l}</div>`).join(''):''}
  ${G.newK&&G.newK.length?`<div class=ht style="color:#76FF03">図鑑に新しく登録:${G.newK.join('、')}</div>`:''}
  <table><tr><th></th><th>${a.n}</th><th>${b.n}</th></tr>
  ${row('化合物点',r=>r.cp)}${row('役ボーナス',r=>r.yp)}${row('カス点',r=>r.jp+'点('+r.junk+'枚)')}${row('先攻補正点',r=>r.fb)}
  <tr><td>合計</td>${[0,1].map(i=>`<td>${w===i?'<b>'+G.p[i].res.total+'点</b>':'0点(あがりなし)'}</td>`).join('')}</tr></table>
  ${matchHTML()}</div></div>`;
}
function render(){
  if(!M){$('app').innerHTML=`${nav()}<div style="text-align:center;margin:40px 0"><h2>元素カードゲーム</h2><p>何ゲーム勝負にしますか?</p>${[1,3,5].map(n=>`<button class=b onclick="start(${n})">${n}ゲーム勝負</button>`).join('')}<p class=ht>各ゲームは、得点が多い方(あがった人)の勝ち。勝ったゲームが多い方がマッチの勝者です。</p></div>${V?modal():''}`;return}
  const cols=Math.max(4,Math.min(13,Math.floor((innerWidth-16)/58)));
  const cw=(Math.min(innerWidth,1100)-16-4*(cols-1))/cols;
  document.documentElement.style.setProperty('--cols',cols);
  document.documentElement.style.setProperty('--cw',cw+'px');
  $('app').innerHTML=`${nav()}<div class=top>${G.p.map(panel).join('')}</div><div class=msg>${G.msg||''}</div>
  <div class=bw>${G.banner?`<div class=banner>${G.banner}</div>`:''}${float()}<div class=board>${G.b.map(card).join('')}</div></div><div class=act>${act()}</div>${modal()}${recipes()}`;
  G.banner='';
}
addEventListener('resize',()=>render());
render();
</script></body></html>
